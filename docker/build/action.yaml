name: "Build"
description: "Build image and push to GitHub Packages"
outputs:
  image:
    description: "Base image repository for the canonical tag"
    value: ${{ steps.derive-outputs.outputs.image }}
  tag:
    description: "Canonical first tag from normalized tags"
    value: ${{ steps.derive-outputs.outputs.tag }}
  tags:
    description: "Normalized newline-separated list of pushed tags"
    value: ${{ steps.derive-outputs.outputs.tags }}
  digest:
    description: "Image digest from docker/build-push-action"
    value: ${{ steps.derive-outputs.outputs.digest }}
  image-tag:
    description: "Canonical image reference in image:tag format"
    value: ${{ steps.derive-outputs.outputs.image-tag }}
  image-digest:
    description: "Canonical image reference in image@digest format when digest exists"
    value: ${{ steps.derive-outputs.outputs.image-digest }}
inputs:
  image-name:
    description: "Name of the Docker image"
    required: true
  dockerfile-path:
    description: "Path to the Dockerfile"
    required: false
    default: "Dockerfile"
  context:
    description: "Build Context"
    required: false
    default: "."
  build-args:
    description: 'Adds support for Dockerfile build arguments. Ex: "BUILD_UID=1001'
    required: false
    default: ""
  tag-latest:
    description: "Add latest for generated Docker Tag"
    required: false
    default: "auto"
  tag-prefix:
    description: "Add prefix for generated Docker Tag"
    required: false
    default: ""
  tag-prefix-latest:
    description: "Add prefix for latest Docker Tag"
    required: false
    default: "false"
  tag-suffix:
    description: "Add a suffix for generated Docker Tag"
    required: false
    default: ""
  tag-suffix-latest:
    description: "Add suffix for latest Docker Tag"
    required: false
    default: "false"
  github-token:
    description: "GitHub token"
    required: true
  registry:
    description: "GitHub Packages registry"
    required: false
    default: "ghcr.io"
  checkout:
    description: "Checkout code"
    required: false
    default: "true"
  tags:
    description: "Additional tags (newline separated)"
    required: false
    default: ""
  extra-tags:
    description: >-
      Newline-separated tags to publish in addition to the derived ones, for content tags
      and other aliases that should be pushed by the same build rather than re-tagged
      afterwards. Full references, e.g. ghcr.io/owner/repo:src-abc123 — unlike
      docker/promote, a bare value is not prefixed with the image.
    required: false
    default: ""
  cache:
    description: >-
      Read and write a registry layer cache at <image>:cache. Worth it when the cached
      steps are slow and the layers they produce are small. Set false when the reverse
      holds — moving a large layer over the network can cost more than rerunning the
      step that built it.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Checkout code
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ inputs.registry }}/${{ inputs.image-name }}
        tags: |
          type=semver,pattern={{version}}
        flavor: |
          latest=${{ inputs.tag-latest }}
          prefix=${{ inputs.tag-prefix }},onlatest=${{ inputs.tag-prefix-latest }}
          suffix=${{ inputs.tag-suffix }},onlatest=${{ inputs.tag-suffix-latest }}

    - name: Build and push Docker image
      id: build-and-push
      # v6, not v5: DOCKER_BUILD_SUMMARY below is only honoured from v6.3.0, and on v5 the
      # summary post step it disables does not exist to begin with.
      uses: docker/build-push-action@v6
      env:
        # The post step uploads a build-summary artifact via `buildx history export
        # --finalize`, which costs tens of seconds per build and is rarely opened.
        DOCKER_BUILD_SUMMARY: "false"
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile-path }}
        push: true
        tags: |
          ${{ inputs.tags != '' && inputs.tags || steps.meta.outputs.tags }}
          ${{ inputs.extra-tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: ${{ inputs.cache == 'true' && format('type=registry,ref={0}/{1}:cache', inputs.registry, inputs.image-name) || '' }}
        cache-to: ${{ inputs.cache == 'true' && format('type=registry,mode=max,ref={0}/{1}:cache', inputs.registry, inputs.image-name) || '' }}
        build-args: |
          ${{ inputs.build-args }}

    - name: Derive action outputs
      id: derive-outputs
      shell: bash
      env:
        INPUT_TAGS: ${{ inputs.tags }}
        EXTRA_TAGS: ${{ inputs.extra-tags }}
        META_TAGS: ${{ steps.meta.outputs.tags }}
        BUILD_DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: |
        set -euo pipefail

        normalized_tags="${INPUT_TAGS}"
        if [ -z "${normalized_tags}" ]; then
          normalized_tags="${META_TAGS}"
        fi

        # Appended, not prepended: `tag` and `image` below are derived from the first
        # entry, and an alias must not displace the canonical tag a caller hands on.
        if [ -n "${EXTRA_TAGS}" ]; then
          normalized_tags="$(printf '%s\n%s\n' "${normalized_tags}" "${EXTRA_TAGS}")"
        fi

        normalized_tags="$(printf '%s\n' "${normalized_tags}" | sed '/^[[:space:]]*$/d')"
        first_tag="$(printf '%s\n' "${normalized_tags}" | sed -n '1p')"

        image=""
        if [ -n "${first_tag}" ]; then
          image="${first_tag%:*}"
        fi

        digest="${BUILD_DIGEST}"
        image_tag=""
        image_digest=""

        if [ -n "${first_tag}" ]; then
          image_tag="${first_tag}"
        fi

        if [ -n "${image}" ] && [ -n "${digest}" ]; then
          image_digest="${image}@${digest}"
        fi

        {
          echo "tags<<EOF"
          printf '%s\n' "${normalized_tags}"
          echo "EOF"
          echo "tag=${first_tag}"
          echo "image=${image}"
          echo "digest=${digest}"
          echo "image-tag=${image_tag}"
          echo "image-digest=${image_digest}"
        } >> "${GITHUB_OUTPUT}"

    - name: Logout from GitHub Container Registry
      if: always()
      run: docker logout ${{ inputs.registry }}
      shell: bash
