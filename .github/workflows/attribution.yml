name: Attribution

# No `paths` filter, deliberately. This is the repository's merge gate on attribution, and a
# path-filtered workflow does not report at all on a pull request that misses its paths — a
# required check that never reports leaves that pull request blocked rather than passing.
# Every other workflow here is filtered; this one must not be.
on:
  pull_request:
    # `edited` is load-bearing: the pull request body is an input to the check, so without it
    # a body that fixes a reported failure never re-runs the check and the run stays red on a
    # payload that no longer matches the pull request.
    types: [opened, synchronize, reopened, edited]

# Nothing here needs a token: the job reads the checkout and inspects commit messages.
permissions:
  contents: read

jobs:
  attribution:
    name: Attribution
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the action walks base..head, and a depth-1 clone has neither
      # end of that range.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Attribution
        uses: ./git/attribution
