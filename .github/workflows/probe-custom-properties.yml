name: probe-custom-properties

on:
  push:
    branches: ['probe/**']
  pull_request:
    branches: [main]

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          echo "TYPE=[${{ github.event.repository.custom_properties.GHA_RUNNER_TYPE }}]"
          echo "SIZE=[${{ github.event.repository.custom_properties.GHA_RUNNER_SIZE }}]"

  arc-exact-case:
    runs-on: arc-small
    timeout-minutes: 3
    steps:
      - run: echo "exact-case label matched"

  arc-upper-case:
    runs-on: ${{ format('arc-{0}', github.event.repository.custom_properties.GHA_RUNNER_SIZE) }}
    timeout-minutes: 3
    steps:
      - run: echo "UPPERCASE label matched -> label matching is case-insensitive"
