name: probe-custom-properties

on:
  push:
    branches: ['probe/**']
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ${{ github.event.repository.custom_properties.GHA_RUNNER_TYPE == 'PRIVATE' && 'arc-small' || 'ubuntu-latest' }}
    steps:
      - name: Dump custom properties from the github context
        run: |
          echo "event=${{ github.event_name }}"
          echo "TYPE=[${{ github.event.repository.custom_properties.GHA_RUNNER_TYPE }}]"
          echo "SIZE=[${{ github.event.repository.custom_properties.GHA_RUNNER_SIZE }}]"
          echo "--- toJSON(custom_properties) ---"
          cat <<'EOF'
          ${{ toJSON(github.event.repository.custom_properties) }}
          EOF
